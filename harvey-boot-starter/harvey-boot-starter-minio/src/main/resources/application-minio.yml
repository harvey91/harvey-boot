# Minio 配置模板(参考, 默认端口 9000)。
# 注意: 开启 Minio 需显式配置 minio.enable=true, 未开启时不会加载任何 Minio Bean。
# minio:
#   enable: true
#   # 外网地址
#   endpoint: http://127.0.0.1:9000
#   # 内网地址, 可选, 未配置时回退 endpoint
#   innerEndpoint: http://127.0.0.1:9000
#   # 默认存储桶
#   bucketName: harvey
#   accessKey: minioadmin
#   secretKey: minioadmin