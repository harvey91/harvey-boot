server:
  port: 8080
  servlet:
    context-path: /admin
spring:
  application:
    name: harvey-admin
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    default-property-inclusion: non_null
  profiles:
    active: @activeProfile@, core
  # spring.ai 兜底配置(数据库未配置默认模型时使用)
  ai:
    openai:
      api-key: sk-11111
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat

# 对象存储配置(本地/阿里云/腾讯云/七牛/Minio)
storage:
  # 当前工作的对象存储模式，分别是local、aliyun、tencent、qiniu、minio
  active: minio
  # 本地对象存储配置信息
  local:
    storagePath: G:/storage
    # fetch方法对应的地址
    address: /storage/fetch
  # 阿里云对象存储配置信息
  aliyun:
    endpoint: oss-cn-shenzhen.aliyuncs.com
    accessKeyId: 111111
    accessKeySecret: xxxx
    bucketName: myBucketName
  # 腾讯对象存储配置信息，请参考 https://cloud.tencent.com/document/product/436/6249
  tencent:
    secretId: 111111
    secretKey: xxxxx
    region: ap-shanghai
    bucketName: myBucketName
  # 七牛云对象存储配置信息
  qiniu:
    endpoint: http://pd5cb6ulu.bkt.clouddn.com
    accessKey: 111111
    secretKey: xxxxxx
    bucketName: mall
  # Minio 对象存储配置信息(本地 Docker minio 默认账号 minioadmin/minioadmin)
  minio:
    # 外网地址
    endpoint: http://127.0.0.1:9000
    # 内网地址, 可选, 未配置时回退 endpoint, 用于读写回源
    innerEndpoint: http://127.0.0.1:9000
    accessKey: minioadmin
    secretKey: minioadmin
    bucketName: harvey
    # 下载访问地址(与 generateUrl 拼接一致, 需包含 bucketName)
    address: http://127.0.0.1:9000/harvey

management:
  endpoints:
    web:
      exposure:
        include: 'health,info'
      base-path: /actuator

# sa-token
sa-token:
  # token 名称（同时也是请求头 key）
  token-name: Authorization
  # token 前缀，前端携带的 token 为：Bearer <token>
  token-prefix: Bearer
  # token 有效期，单位：秒（默认 30 天）
  timeout: 3600
  # token 临时有效期（指定时间内无操作就视为 token 过期），单位：秒，-1 表示不设
  active-timeout: -1
  # 是否允许同一账号并发登录（为 true 时允许一起登录，为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token（为 true 时所有登录共用一个 token，为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 是否在初始化配置时打印版本字符画
  is-print: false
  # 关闭 cookie 读取，前后端分离
  is-read-cookie: false

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.harvey.system.controller,com.harvey.ai.controller,com.harvey.screen.controller

# 信发 TCP 服务(设备长连接)
harvey:
  screen:
    netty:
      enabled: true
      port: 10000
      reader-idle-seconds: 90
      login-timeout-seconds: 30
      auth:
        required: true
        # 骨架阶段：空表示允许任意非空 token；生产接入 Redis/DB 校验后请移除
        token-whitelist: []
    # 多节点集群(依赖 Redis)：各节点把本机在线设备登记到独立 Set，节点宕机自动离线；
    # 跨节点指令经 Redis 频道转发到设备所在节点下发
    cluster:
      enabled: true
      # 节点id，为空时默认 本机IP:TCP端口(端口唯一)
      node-id: ""
      # 在线登记 TTL(秒)，心跳续期；节点宕机超过该时长设备自动离线
      online-ttl-seconds: 120
      # 跨节点指令转发频道
      command-channel: "harvey:screen:command"
    # 指令超时轮询：已发送后超过时限无应答 -> 判定超时(条件UPDATE幂等，多节点安全)
    command-timeout:
      enabled: true
      timeout-seconds: 30
      scan-interval-seconds: 60
